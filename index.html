<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control PC</title>
  <style>
    body { text-align:center; font-family:sans-serif; margin-top:80px; background:#1a1a1a; color:white; }
    button { font-size:22px; padding:20px 50px; background:#e74c3c; color:white; border:none; border-radius:10px; cursor:pointer; }
    #status { margin-top:20px; color:#aaa; }
  </style>
</head>
<body>
  <h2>Control PC</h2>
  <button onclick="encender()">Encender PC</button>
  <p id="status">Conectando...</p>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
  <script>
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
    client.on('connect', () => { document.getElementById('status').textContent = 'Listo'; });
    function encender() {
      client.publish('angel/pc/comando', 'encender');
      document.getElementById('status').textContent = '✅ Señal enviada!';
    }
  </script>
</body>
</html>
